version: "3"

services:
  facade-service:
    build: ./facade-service
    ports:
      - "5000:5000"
    depends_on:
      - logging-service
      - counter-service

  logging-service:
    build: ./logging-service
    ports:
      - "5001:5001"

  counter-service:
    build: ./counter-service
    ports:
      - "5002:5002"